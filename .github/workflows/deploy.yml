name: Deploy explorer to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remaju-production
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
        env:
          VITE_DEMO: ${{ vars.DATA_URL == '' }}
          VITE_DATA_URL: ${{ vars.DATA_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-site
          path: src/web/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://remaju.mejora.me
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: explorer-site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4.54.0 pages deploy site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
