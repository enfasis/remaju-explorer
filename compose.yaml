services:
  collector:
    image: remaju-collector:dev
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    volumes:
      - ./var:/app/var
    environment:
      PYTHONPATH: /app/src
  web:
    image: remaju-web:dev
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev
