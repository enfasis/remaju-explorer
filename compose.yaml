services:
  collector:
    image: remaju-collector:dev
    build:
      context: .
      dockerfile: src/collector/Dockerfile
    volumes:
      - ./var:/app/var
    environment:
      PYTHONPATH: /app/src/collector
  web:
    image: remaju-web:dev
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev
