[project]
name = "remaju-collector"
version = "0.1.0"
description = "REMAJU auction collector"
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "hcaptcha-challenger>=0.19.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "responses>=0.25.8",
    "selectolax>=0.4.6",
    "streamlit>=1.54.0",
    "streamlit-folium>=0.26.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
