[project]
name = "remaju-collector"
version = "0.1.0"
description = "REMAJU auction collector"
requires-python = ">=3.14"
dependencies = [
    "clypi>=1.9.1",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "selectolax>=0.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
